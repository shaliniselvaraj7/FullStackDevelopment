<html>
<head>
    <title>Flexbox Navbar</title>

    <style>
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            padding: 15px;
        }

        .logo {
            color: white;
            font-size: 25px;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MyLogo
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

    </nav>

</body>
</html>
