<!DOCTYPE html>
<html>
<head>
    <title>User Profile Card</title>

    <style>
        .card {
            width: 250px;
            padding: 20px;
            border: 2px solid black;
            text-align: center;
        }

        img {
            display: block;
            width: 120px;
            height: 120px;
            margin: auto;
        }

        .name {
            display: block;
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 10px;
            background-color: lightgreen;
            border: 1px solid green;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="C:\shalini\shalini photo.jpg" alt="Profile">

        <span class="name">Shalini</span>

        <span class="status">Online</span>

    </div>

</body>
</html>
