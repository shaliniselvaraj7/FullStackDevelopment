<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        li {
            display: inline;
            margin-right: 30px;
        }

        a {
            color: black;
        }
    </style>
</head>

<body>

    <h2>My Website</h2>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">Contact</a></li>
    </ul>

</body>
</html>
