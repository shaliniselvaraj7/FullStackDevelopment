<html>
    <head>
        <title> Task 6</title>
        <style>
            body{
                background-color: blue;
            }
            form{
                background-color: white;
                align-content: center;
                margin: 150px;
                padding-bottom: 150px;
            }
            .head{
                font-weight: bolder;
                padding-top: 10px;
                font-size: larger;
                font-family: Arial, Helvetica, sans-serif;
                color: rgb(32, 32, 32) ;

            }
            .name{
                float: left;
                padding-right: 70px;
                padding-left: 40px;
            }
            .number{
                float:left;
                padding-right: 70px;
                padding-left: 40px;
                
            }
        </style>
    </head>
    <body> 
        <form>
            <div class="head"> Send us a Message</div>
            <hr/>
            <div class="name">
                <input type="text" placeholder="CodingNepal" />
            </div>
            <div class="email">
                <input type="email" placeholder="Enter your email"/>
            </div>
            <div class="number">
                <input type="number" placeholder="Enter your phone"/>
            </div>
            <div class="website">
                <input type="url" placeholder="Enter your Website"/>
            </div>
            <div class="message">
                <textarea cols="80px" rows="10px" placeholder=" Write your message"></textarea>
            </div>
            <div class="button">
                <button type="submit">Send your Message</button>
            </div>
            <div class="output">
                <h6>Sending your message</h6>
            </div>
        </form>
    </body>
</html>
