<html>
    <head>
        <title>BootStrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
      <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            justify-content: center;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .menu a:hover {
            color: #60a5fa;
        }

        body {
            background-color: #dbeafe;
        }
      </style>
    </head>
    <body>
        <header>
       <nav class="navbar">

        <div class="logo">
           <h1>Shalini Selvaraj</h1>
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </nav>
    </header>
        <div class="container mt-5">
            <img src="C:\shalini\shalini photo.jpg" class="rounded" alt="My Photo">
            <p></p>
        </div>
    </body>
</html>
